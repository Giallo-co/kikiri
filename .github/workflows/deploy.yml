name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build

      - name: Deploy to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist,node_modules,package.json,prisma,systemd"
          target: "/var/www/kikiri/kikiri"
          overwrite: true

      - name: Restart service
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            
            cd /var/www/kikiri/kikiri
            
            sudo cp systemd/social-media-api.service /etc/systemd/system/
            sudo systemctl daemon-reload
            
            # Recreación del .env incluyendo la arquitectura de AWS
            cat <<EOF > /var/www/kikiri/kikiri/.env
            PORT=${{ secrets.PORT }}
            HOST=0.0.0.0
            PROTOCOL=http
            API_BASE_PATH=/user
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            AWS_REGION=us-east-1
            DYNAMODB_TABLE_NAME=KikiriSocial
            EOF
            
            npx prisma migrate deploy
            sudo systemctl restart social-media-api
            systemctl is-active --quiet social-media-api && echo "Service Running" || exit 1
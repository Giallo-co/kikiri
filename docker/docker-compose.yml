services:
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  dynamodb:
    image: amazon/dynamodb-local:latest
    restart: unless-stopped
    ports:
      - "8002:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    restart: unless-stopped
    ports:
      - "8003:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
    depends_on:
      - dynamodb

  backend:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: kikiri-server
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - S3_ENDPOINT=http://minio:9000
      - DYNAMO_ENDPOINT=http://dynamodb:8000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-password123}
    depends_on:
      - minio
      - dynamodb
    volumes:
      - ..:/app
      - /app/node_modules

volumes:
  minio_data:
version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: social-media
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  dynamodb:
    image: amazon/dynamodb-local
    container_name: dynamodb-local
    restart: always
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"

volumes:
  mysql_data:

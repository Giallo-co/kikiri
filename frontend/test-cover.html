<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Full Screen Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background: black;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain; /* use 'cover' if you want it to fill completely */
      display: block;
    }
  </style>
</head>
<body>
  <img src="http://localhost:9000/music-cover/volume-alpha.jpg" alt="cover" />
</body>
</html>

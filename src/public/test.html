<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Picture Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0c0c0e;
      --surface: #141417;
      --border: #2a2a30;
      --accent: #e8ff47;
      --accent-dim: #b5c736;
      --text: #f0f0f0;
      --muted: #6b6b78;
      --success: #47ffb2;
      --error: #ff5e5e;
      --radius: 12px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 480px;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(232,255,71,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .drop-zone {
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }

    .drop-zone:hover,
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(232,255,71,0.03);
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 28px;
      margin-bottom: 10px;
      display: block;
    }

    .drop-label {
      font-size: 14px;
      color: var(--muted);
    }

    .drop-label span {
      color: var(--accent);
      font-weight: 600;
    }

    .file-info {
      margin-top: 12px;
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      color: var(--accent-dim);
      display: none;
    }

    .preview-wrap {
      margin-top: 14px;
      display: none;
      justify-content: center;
    }

    .preview-wrap img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .btn {
      width: 100%;
      margin-top: 28px;
      padding: 14px;
      background: var(--accent);
      color: #0c0c0e;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    .log {
      margin-top: 28px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      line-height: 1.7;
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }

    .log-entry { display: flex; gap: 10px; }
    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-msg { color: var(--text); }
    .log-msg.ok { color: var(--success); }
    .log-msg.err { color: var(--error); }
    .log-msg.info { color: var(--accent); }

    .progress-bar {
      height: 3px;
      background: var(--border);
      border-radius: 99px;
      margin-top: 20px;
      overflow: hidden;
      display: none;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      width: 0%;
      transition: width 0.3s ease;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Profile Picture</h1>
  <p class="subtitle">presigned url upload test</p>

  <div class="field">
    <label>User ID</label>
    <input type="number" id="userId" placeholder="e.g. 1" />
  </div>

  <div class="field">
    <label>Image</label>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" />
      <span class="drop-icon">⬆</span>
      <p class="drop-label">Drop file or <span>browse</span></p>
    </div>
    <div class="file-info" id="fileInfo"></div>
    <div class="preview-wrap" id="previewWrap">
      <img id="preview" src="" alt="preview" />
    </div>
  </div>

  <div class="progress-bar" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <button class="btn" id="uploadBtn" disabled>Upload</button>

  <div class="log" id="log"></div>
</div>

<script>
  const API_BASE = '';

  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const fileInfo = document.getElementById('fileInfo');
  const previewWrap = document.getElementById('previewWrap');
  const preview = document.getElementById('preview');
  const uploadBtn = document.getElementById('uploadBtn');
  const userIdInput = document.getElementById('userId');
  const logEl = document.getElementById('log');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');

  let selectedFile = null;

  function log(msg, type = '') {
    logEl.style.display = 'block';
    const now = new Date().toLocaleTimeString('en', { hour12: false });
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="log-time">${now}</span><span class="log-msg ${type}">${msg}</span>`;
    logEl.appendChild(entry);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setProgress(pct) {
    progressBar.style.display = 'block';
    progressFill.style.width = pct + '%';
  }

  function checkReady() {
    uploadBtn.disabled = !(selectedFile && userIdInput.value.trim());
  }

  userIdInput.addEventListener('input', checkReady);

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    selectedFile = file;
    fileInfo.style.display = 'block';
    fileInfo.textContent = `${file.name} — ${(file.size / 1024).toFixed(1)} KB — ${file.type}`;
    const reader = new FileReader();
    reader.onload = (e) => {
      preview.src = e.target.result;
      previewWrap.style.display = 'flex';
    };
    reader.readAsDataURL(file);
    checkReady();
  }

  uploadBtn.addEventListener('click', async () => {
    const userId = userIdInput.value.trim();
    if (!userId || !selectedFile) return;

    uploadBtn.disabled = true;
    setProgress(10);

    try {
      log('Requesting presigned URL...', 'info');

      const params = new URLSearchParams({
        userId,
        contentType: selectedFile.type,
      });

      const presignRes = await fetch(`${API_BASE}/api/profile-picture/presigned-url?${params}`);
      if (!presignRes.ok) {
        const err = await presignRes.json();
        throw new Error(err.error || 'Failed to get presigned URL');
      }

      const { presignedUrl, key } = await presignRes.json();
      log(`Presigned URL obtained`, 'ok');
      log(`S3 key: ${key}`, '');
      setProgress(35);

      log('Uploading image directly to S3...', 'info');

      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', presignedUrl);
        xhr.setRequestHeader('Content-Type', selectedFile.type);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            const pct = 35 + Math.round((e.loaded / e.total) * 45);
            setProgress(pct);
          }
        };
        xhr.onload = () => xhr.status === 200 ? resolve() : reject(new Error(`S3 upload failed: ${xhr.status}`));
        xhr.onerror = () => reject(new Error('S3 upload network error'));
        xhr.send(selectedFile);
      });

      log('Image uploaded to S3', 'ok');
      setProgress(85);

      log('Confirming upload with backend...', 'info');

      const confirmRes = await fetch(`${API_BASE}/api/profile-picture/confirm`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: parseInt(userId),
          key,
          contentType: selectedFile.type,
          size: selectedFile.size,
          originalName: selectedFile.name,
        }),
      });

      if (!confirmRes.ok) {
        const err = await confirmRes.json();
        throw new Error(err.error || 'Confirmation failed');
      }

      const result = await confirmRes.json();
      setProgress(100);
      log(result.message, 'ok');
      log(`S3 URL: ${result.data.s3Url}`, '');

    } catch (err) {
      log(err.message, 'err');
      setProgress(0);
    } finally {
      uploadBtn.disabled = false;
    }
  });
</script>
</body>
</html>
